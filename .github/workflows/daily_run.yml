name: Daily Stock Predictor Pipeline

on:
  schedule:
    # 13:30 UTC = 8:30 AM EDT (summer) / 7:30 AM EST (winter)
    #           = 8:30 AM CDT (summer) / 7:30 AM CST (winter)
    # Runs before US market open (9:30 AM ET) year-round, no DST adjustment needed.
    # Scheduled at :30 past the hour to avoid GitHub Actions top-of-hour congestion.
    - cron: "30 13 * * 1-5"   # Monday–Friday only

  workflow_dispatch:           # Allow manual trigger from GitHub UI

permissions:
  contents: write              # Needed to push updated data/JSON files

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        id: pipeline
        run: python run_pipeline.py

      - name: Commit and push updated data
        if: always()   # run even if pipeline step failed — preserve any generated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage outputs — parquet cache and model files are intentionally
          # excluded: they are large binaries whose mtime gets reset on
          # checkout, which defeats the staleness check in cache_manager.py.
          git add docs/predictions.json docs/accuracy.json || true
          git add data/predictions_ledger.csv || true
          # Only commit if there are staged changes
          git diff --cached --quiet || git commit -m "chore: daily pipeline run $(date -u +%Y-%m-%d) [status: ${{ steps.pipeline.outcome }}]"
          git push || true
